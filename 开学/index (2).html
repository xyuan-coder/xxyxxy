<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谢心媛 · 个人简历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ===== 全局重置 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --color-primary: #6C5CE7;
            --color-primary-light: #8B7CF7;
            --color-primary-dark: #4A3DB8;
            --color-accent: #FDCB6E;
            --color-accent-light: #FDE68A;
            --color-bg: #F8F7FC;
            --color-card: #FFFFFF;
            --color-text: #1A1A2E;
            --color-text-secondary: #4A4A6A;
            --color-text-muted: #8A8AA8;
            --color-border: #E8E6F0;
            --color-shadow: rgba(108, 92, 231, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            --mono: "DM Mono", ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
            --max-width: 1100px;
            --nav-height: 64px;
        }
        [data-theme="dark"] {
            --color-bg: #0F0E17;
            --color-card: #1A1A2E;
            --color-text: #EAE8F0;
            --color-text-secondary: #B8B6D0;
            --color-text-muted: #7A7890;
            --color-border: #2A2A44;
            --color-shadow: rgba(0, 0, 0, 0.3);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            min-height: 100vh;
        }
        a {
            color: var(--color-primary);
            text-decoration: none;
        }
        a:hover {
            color: var(--color-primary-light);
        }
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 10px;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--color-card);
            border-bottom: 1px solid var(--color-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.75);
            z-index: 1000;
            display: flex;
            align-items: center;
            transition: background var(--transition), border-color var(--transition);
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 14, 23, 0.85);
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex-wrap: wrap;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--color-text);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-brand span {
            color: var(--color-primary);
        }
        .navbar-brand .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--color-primary);
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .navbar-links a {
            font-size: 0.82rem;
            color: var(--color-text-secondary);
            padding: 4px 10px;
            border-radius: 20px;
            transition: all var(--transition);
            font-weight: 500;
        }
        .navbar-links a:hover {
            color: var(--color-primary);
            background: var(--color-border);
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .navbar-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            transition: all var(--transition);
            background: var(--color-border);
        }
        .navbar-actions button:hover {
            background: var(--color-primary);
            color: #fff;
        }
        .navbar-actions .print-btn {
            font-size: 1rem;
        }

        /* ===== Hero ===== */
        .hero {
            padding: 48px 0 32px;
            position: relative;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        .hero-content h1 {
            font-size: 2.6rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        .hero-content h1 .highlight {
            color: var(--color-primary);
            position: relative;
        }
        .hero-content .motto {
            font-size: 1.05rem;
            color: var(--color-text-secondary);
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .hero-content .motto em {
            font-style: normal;
            color: var(--color-primary);
            font-weight: 500;
        }
        .hero-content .bio {
            margin-top: 16px;
            font-size: 0.98rem;
            color: var(--color-text-secondary);
            max-width: 480px;
            line-height: 1.7;
        }
        .hero-contact {
            margin-top: 12px;
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            background: var(--color-card);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            display: inline-block;
            backdrop-filter: blur(4px);
        }
        .hero-contact span {
            margin: 0 10px;
            color: var(--color-text-muted);
        }
        .hero-contact a {
            color: var(--color-primary);
            font-weight: 500;
        }
        .hero-contact a:hover {
            text-decoration: underline;
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }
        .hero-tags .tag {
            background: var(--color-border);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
        }
        .hero-tags .tag:hover {
            background: var(--color-primary);
            color: #fff;
            transform: translateY(-1px);
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }
        .hero-actions .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--color-primary);
            color: #fff;
        }
        .hero-actions .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.25);
        }
        .hero-actions .btn-outline {
            background: transparent;
            border: 2px solid var(--color-border);
            color: var(--color-text-secondary);
        }
        .hero-actions .btn-outline:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: transparent;
            box-shadow: none;
        }
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-visual .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 16px 48px rgba(108, 92, 231, 0.15);
            border: 4px solid var(--color-card);
        }
        .hero-stats-mini {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 24px;
            max-width: 480px;
        }
        .hero-stats-mini .stat-item {
            text-align: center;
            padding: 10px 8px;
            background: var(--color-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            transition: all var(--transition);
        }
        .hero-stats-mini .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--color-shadow);
        }
        .hero-stats-mini .stat-number {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-primary);
        }
        .hero-stats-mini .stat-label {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            margin-top: 2px;
        }

        /* ===== Hero 定位徽章与定位语 ===== */
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.25);
        }
        .hero-position {
            margin-top: 10px;
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--color-primary);
            letter-spacing: 0.3px;
        }

        /* ===== 关于我 ===== */
        .about-card {
            background: var(--color-card);
            border-radius: var(--radius);
            border: 1px solid var(--color-border);
            padding: 28px 32px;
            transition: all var(--transition);
        }
        .about-card:hover {
            box-shadow: 0 8px 28px var(--color-shadow);
        }
        .about-edu {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--color-primary);
            background: rgba(108, 92, 231, 0.12);
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .about-advantage {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            line-height: 1.8;
            margin-bottom: 22px;
        }
        .about-experiences {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .about-exp-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 14px 16px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            transition: all var(--transition);
        }
        .about-exp-item:hover {
            transform: translateY(-2px);
            border-color: var(--color-primary-light);
        }
        .about-exp-item .icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            line-height: 1.5;
        }
        .about-exp-item .t {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-text);
        }
        .about-exp-item .d {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-top: 3px;
            line-height: 1.55;
        }
        .about-positioning-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--color-text-muted);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .about-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .about-pills .pill {
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--color-primary);
            color: #fff;
            transition: all var(--transition);
        }
        .about-pills .pill:hover {
            transform: translateY(-2px);
            background: var(--color-primary-light);
            box-shadow: 0 6px 16px rgba(108, 92, 231, 0.3);
        }
        .about-quote {
            border-left: 3px solid var(--color-primary);
            padding: 6px 0 6px 16px;
            font-size: 0.92rem;
            color: var(--color-text-secondary);
            line-height: 1.7;
        }

        /* ===== 通用 Section ===== */
        section {
            padding: 40px 0;
            border-bottom: 1px solid var(--color-border);
            transition: border-color var(--transition);
        }
        section:last-of-type {
            border-bottom: none;
        }
        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 26px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
            letter-spacing: -0.5px;
        }
        .section-title .badge {
            order: -1;
            width: 100%;
            font-family: var(--mono);
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--color-primary);
            padding: 0;
            background: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .badge::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--color-border);
        }
        .section-title .line {
            flex: 1;
            height: 2px;
            background: var(--color-border);
            border-radius: 2px;
        }

        /* ===== 亮点成果 ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .highlight-card {
            background: var(--color-card);
            padding: 18px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            transition: all var(--transition);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .highlight-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px var(--color-shadow);
            border-color: var(--color-primary-light);
        }
        .highlight-card .icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .highlight-card .text {
            font-size: 0.88rem;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }
        .highlight-card .text strong {
            color: var(--color-text);
            font-weight: 600;
        }

        /* ===== 技能矩阵 ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .skill-group {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            border: 1px solid var(--color-border);
            transition: all var(--transition);
        }
        .skill-group:hover {
            box-shadow: 0 4px 16px var(--color-shadow);
        }
        .skill-group .group-title {
            font-weight: 600;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-muted);
            margin-bottom: 10px;
        }
        .skill-group .items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .skill-group .items .pill {
            background: var(--color-border);
            padding: 3px 14px;
            border-radius: 16px;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
        }
        .skill-group .items .pill:hover {
            background: var(--color-primary);
            color: #fff;
        }

        /* ===== 教育 & 证书 ===== */
        .edu-card {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            border: 1px solid var(--color-border);
            transition: all var(--transition);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .edu-card:hover {
            box-shadow: 0 6px 20px var(--color-shadow);
        }
        .edu-card .info .school {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .edu-card .info .detail {
            font-size: 0.88rem;
            color: var(--color-text-secondary);
        }
        .edu-card .info .detail .meta {
            color: var(--color-text-muted);
            font-size: 0.82rem;
        }
        .edu-card .period {
            font-size: 0.82rem;
            color: var(--color-text-muted);
        }

        /* ===== 证书图片 ===== */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 8px;
        }
        .cert-item {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            overflow: hidden;
            transition: all var(--transition);
        }
        .cert-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px var(--color-shadow);
            border-color: var(--color-primary-light);
        }
        .cert-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            aspect-ratio: 16 / 10;
            background: var(--color-bg);
        }
        .cert-item .caption {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            border-top: 1px solid var(--color-border);
            text-align: center;
        }

        /* ===== 微信二维码在页脚 ===== */
        .footer-qr {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .footer-qr img {
            width: 120px;
            height: 120px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--color-border);
            background: var(--color-card);
            object-fit: contain;
        }
        .footer-qr .qr-label {
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        /* ===== 页脚 ===== */
        .footer {
            padding: 24px 0 32px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--color-text-muted);
            border-top: 1px solid var(--color-border);
            margin-top: 12px;
        }
        .footer .heart {
            color: #FF6B6B;
        }

        /* ===== 返回顶部 ===== */
        .back-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-primary);
            color: #fff;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.3);
            transition: all var(--transition);
            opacity: 0;
            visibility: hidden;
            transform: translateY(16px);
            z-index: 900;
        }
        .back-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .back-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(108, 92, 231, 0.4);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--color-card);
            color: var(--color-text);
            padding: 10px 24px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            border: 1px solid var(--color-border);
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 背景音乐播放器 ===== */
        .music-player {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 950;
            width: min(430px, calc(100vw - 40px));
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            box-shadow: 0 16px 40px var(--color-shadow);
            padding: 14px 16px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px 14px;
            align-items: center;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }
        .music-player .player-copy {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .music-player .player-kicker {
            font-family: var(--mono);
            font-size: 0.62rem;
            font-weight: 500;
            color: var(--color-primary);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .music-player .player-copy strong {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music-player .player-copy small {
            font-size: 0.72rem;
            color: var(--color-text-muted);
        }
        .music-player .player-toggle {
            grid-row: 1;
            grid-column: 2;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: var(--color-primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: all var(--transition);

        function $(sel, ctx) { return (ctx || document).querySelector(sel); }

        function createEl(tag, attrs, html) {
            const el = document.createElement(tag);
            if (attrs) Object.entries(attrs).forEach(([k, v]) => {
                if (k === 'className') el.className = v;
                else if (k === 'text') el.textContent = v;
                else if (k === 'html') el.innerHTML = v;
                else el.setAttribute(k, v);
            });
            if (html) el.innerHTML = html;
            return el;

        function showToast(msg) {
            const t = $('#toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        function copyText(text, successMsg) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => {
                    fallbackCopy(text, successMsg);
                });
            } else {
                fallbackCopy(text, successMsg);
            }
        }

        function fallbackCopy(text, msg) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy');
                showToast(msg); } catch (e) { showToast('复制失败，请手动复制'); }
            document.body.removeChild(ta);
        }

            <p class="about-advantage">${a.advantage}</p>
            <div class="about-experiences">${expHtml}</div>
            <div class="about-positioning-label">个人定位 · POSITIONING</div>
            <div class="about-pills">${pillsHtml}</div>
            <div class="about-quote">💡 ${a.quote}</div>
          `;
        }

        function renderHighlights() {
            const grid = $('#highlightsGrid');
            resume.highlights.forEach(h => {
                const card = createEl('div', { className: 'highlight-card' });
                card.innerHTML = `<span class="icon">${h.icon}</span><span class="text">${h.text}</span>`;
                grid.appendChild(card);
            });
        }

        function renderSkills() {
            const grid = $('#skillsGrid');
            resume.skills.forEach(group => {
                const div = createEl('div', { className: 'skill-group' });
                const itemsHtml = group.items.map(i => `<span class="pill">${i}</span>`).join('');
                div.innerHTML = `
              <div class="group-title">${group.category}</div>
              <div class="items">${itemsHtml}</div>
            `;
                grid.appendChild(div);
            });
        }

        function renderEducation() {
            const container = $('#eduContainer');
            const edu = resume.education;

            const card = createEl('div', { className: 'edu-card' });
            card.innerHTML = `
            <div class="info">
              <div class="school">${edu.school}</div>
              <div class="detail">${edu.degree} · <span class="meta">${edu.major}</span></div>
              <div class="detail" style="font-size:0.82rem;color:var(--color-text-muted);">GPA: ${edu.gpa} · ${edu.courses}</div>
            </div>
            <div class="period">${edu.period}</div>
          `;
            container.appendChild(card);

            const traitBox = createEl('div', {
                className: 'edu-card',
                style: 'margin-top:16px;padding:16px 20px;'
            });
            traitBox.innerHTML = `
            <div style="display:flex;gap:12px;align-items:flex-start;">
              <span style="font-size:1.2rem;">💫</span>
              <div style="font-size:0.88rem;color:var(--color-text-secondary);line-height:1.7;">
                ${resume.traits}
              </div>
            </div>
          `;
            container.appendChild(traitBox);
        }

        function renderCertificates() {
            const grid = $('#certGrid');
            if (!resume.certificates || resume.certificates.length === 0) {
                grid.innerHTML = `<p class="text-muted" style="text-align:center;padding:20px 0;">暂无证书展示</p>`;
                return;
            }
            resume.certificates.forEach(item => {
                const div = createEl('div', { className: 'cert-item' });
                div.innerHTML = `
              <img src="${item.src}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'">
              <div class="caption">${item.title}</div>
            `;
                grid.appendChild(div);
            });
        }

        function bindInteractions() {
            const themeBtn = $('#themeToggle');
            themeBtn.addEventListener('click', toggleTheme);

            const emailBtn = $('#contactEmailBtn');
            emailBtn.addEventListener('click', () => {
                const email = resume.personal.email;
                copyText(email, '📧 邮箱已复制！');
            });

            const phoneBtn = $('#copyPhoneBtn');
            phoneBtn.addEventListener('click', () => {
                const phone = resume.personal.phone;
                copyText(phone, '📱 电话已复制！');
            });

            const backTop = $('#backTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) {
                    backTop.classList.add('visible');
                } else {
                    backTop.classList.remove('visible');
                }
            });
            backTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            $$('.navbar-links a').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.querySelector(a.getAttribute('href'));
                    if (target) {
                        const top = target.getBoundingClientRect().top + window.scrollY - 72;
                        window.scrollTo({ top, behavior: 'smooth' });
                    }
                });
            });
        }

        // ================================================================
        //  背景音乐播放器
        // ================================================================
        function formatMusicTime(seconds) {
            if (!Number.isFinite(seconds)) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const remainder = Math.floor(seconds % 60).toString().padStart(2, '0');
            return minutes + ':' + remainder;
        }

        function initMusic() {
            const player = $('#musicPlayer');
            const audio = $('#musicAudio');
            const toggle = $('#musicToggle');
            const progress = $('#musicProgress');
            const musicCurrent = $('#musicCurrent');
            const musicDuration = $('#musicDuration');
            const musicStatus = $('#musicStatus');
            if (!player || !audio) return;

            function updateMusicState(playing) {
                player.classList.toggle('playing', playing);
                player.classList.toggle('muted', playing && audio.muted);
                toggle.setAttribute('aria-label', playing ? '暂停音乐' : '播放音乐');
                toggle.title = playing ? '暂停音乐' : '播放音乐';
                if (playing && audio.muted) {
                    toggle.setAttribute('aria-label', '开启音乐声音');
                    toggle.title = '开启音乐声音';
                    musicStatus.textContent = '静音自动播放 · 点击开启声音';
                } else {
                    musicStatus.textContent = playing ? '正在播放 · 点击暂停' : '点击播放 · 浏览器可能需要授权';
                }
            }

            toggle.addEventListener('click', async () => {
                if (!audio.paused && audio.muted) {
                    // 静音自动播放获得允许后，首次点击升级为有声播放，不打断音乐
                    audio.muted = false;
                    updateMusicState(true);
                } else if (audio.paused) {
                    audio.muted = false;
                    try {
                        await audio.play();
                    } catch (e) {
                        musicStatus.textContent = '浏览器阻止播放，请再次点击';
                    }
                } else {
                    audio.pause();
                }
            });

            audio.addEventListener('play', () => updateMusicState(true));
            audio.addEventListener('pause', () => updateMusicState(false));
            audio.addEventListener('volumechange', () => {
                if (!audio.paused) updateMusicState(true);
            });
            audio.addEventListener('loadedmetadata', () => {
                musicDuration.textContent = formatMusicTime(audio.duration);
            });
            audio.addEventListener('timeupdate', () => {
                musicCurrent.textContent = formatMusicTime(audio.currentTime);
                progress.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
            });
            audio.addEventListener('ended', () => {
                progress.value = 0;
                musicCurrent.textContent = '0:00';
                updateMusicState(false);
            });
            progress.addEventListener('input', () => {
                if (audio.duration) audio.currentTime = (Number(progress.value) / 100) * audio.duration;
            });

            // 默认静音自动播放，避免打扰访客；首次点击播放器时再开启声音
            audio.volume = 0.42;
            try {
                const autoplayAttempt = audio.play();
                if (autoplayAttempt && typeof autoplayAttempt.catch === 'function') {
                    autoplayAttempt.catch(() => {
                        musicStatus.textContent = '点击播放 · 浏览器需要授权';
                    });
                }
            } catch (e) {
                musicStatus.textContent = '点击播放 · 浏览器需要授权';
            }
        }

        function init() {
            const saved = localStorage.getItem('theme');
            if (saved) setTheme(saved);
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark');

            renderHero();
            renderAbout();
            renderHighlights();
            renderSkills();
            renderEducation();
            renderCertificates();
            bindInteractions();
            initMusic();

            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (!localStorage.getItem('theme')) {
                        setTheme(e.matches ? 'dark' : 'light');
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
